    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666;
            --accent: #2e8b7c;
            --accent-light: rgba(46, 139, 124, 0.1);
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            overflow: hidden;
        }

        .photo-section {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
        }

        .photo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 1.5rem;
        }

        .name {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .title {
            color: var(--accent);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1rem;
            background: var(--bg);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link:hover {
            background: var(--accent-light);
            transform: translateX(4px);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .link-icon svg {
            width: 20px;
            height: 20px;
        }

        .link-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .link-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .whatsapp { --brand: #25D366; }
        .twitter { --brand: #000000; }
        .linkedin { --brand: #0A66C2; }
        .email { --brand: #EA4335; }
        .tiktok { --brand: #000000; }
        .instagram { --brand: #E4405F; }
        .website { --brand: #2e8b7c; }

        .link.whatsapp .link-icon { color: var(--brand); }
        .link.twitter .link-icon { color: var(--brand); }
        .link.linkedin .link-icon { color: var(--brand); }
        .link.email .link-icon { color: var(--brand); }
        .link.tiktok .link-icon { color: var(--brand); }
        .link.instagram .link-icon { color: var(--brand); }
        .link.website .link-icon { color: var(--brand); }

        .save-contact {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .save-contact:hover {
            background: #236b5f;
        }
    </style>
</head>

    <script>
        function saveContact() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Matt Hamilton
TITLE:Founder & Full-Stack Developer
ORG:Dharach
TEL;TYPE=CELL:+12462858172
EMAIL:matt@dharach.com
URL:https://dharach.com/
NOTE:Building civic tech and AI systems in Barbados.
END:VCARD`;
            
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'matt-hamilton.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
